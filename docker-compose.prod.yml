# Production compose file for the single-EC2-instance demo deploy.
# Separate from docker-compose.yml (local dev: --reload, source-mounted) so
# neither file has to compromise for the other's use case.
#
# Needs a top-level .env next to this file with:
#   NEXT_PUBLIC_API_BASE_URL=http://<host-ip>:8000
# (docker compose auto-loads that .env for ${...} substitution below.)
services:
  backend:
    build:
      context: ./opspilot-backend
      dockerfile: Dockerfile
    image: opspilot-backend:prod
    ports:
      - "8000:8000"
    env_file:
      - ./opspilot-backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./opspilot-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    image: opspilot-frontend:prod
    ports:
      - "3000:3000"
    env_file:
      - ./opspilot-frontend/.env.local
    depends_on:
      - backend
    restart: unless-stopped
