# Render Blueprint for the OpsPilot AI backend (FastAPI).
# Docs: https://render.com/docs/blueprint-spec
#
# Render dashboard -> New -> Blueprint -> pick this repo, and Render builds
# opspilot-backend/Dockerfile on its free tier. Every `sync: false` value is
# a secret you paste into the dashboard on first deploy; Render never writes
# them back to this file. The frontend is NOT here -- it deploys to Vercel
# (see docs/DEPLOY.md).
services:
  - type: web
    name: opspilot-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: opspilot-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Dockerfile CMD binds to $PORT; pin it so the EXPOSE'd port and the
      # port Render routes to are the same thing.
      - key: PORT
        value: "8000"
      - key: OPSPILOT_APP_ENV
        value: prod

      # --- AWS (read-only IAM user, see docs/iam-policy.json) --------------
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: OPSPILOT_EC2_INSTANCE_ID
        sync: false

      # --- LLM providers (free tier; at least one key required) -------------
      - key: OPSPILOT_LLM_PRIMARY_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/

      # --- Auth: must match the same two values set on the Vercel project ---
      - key: AUTH_SHARED_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false

      # Your Vercel production URL, e.g. https://opspilot-ai.vercel.app
      # (no trailing slash; comma-separate to allow more than one origin).
      - key: OPSPILOT_CORS_ORIGINS
        sync: false
